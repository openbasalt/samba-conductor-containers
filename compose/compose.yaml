# Samba Conductor: a single Samba AD DC with conductor, for labs and
# evaluation (the DC image is a preview; packages stay the recommended way
# for production DCs). Configuration in .env (copy .env.example), secrets
# in ./secrets (./make-secrets.sh). Add-ons: COMPOSE_FILE in .env, e.g.
#   COMPOSE_FILE=compose.yaml:addons/idp.yaml:addons/sync.yaml:addons/backup.yaml
#
# First start, in order:
#   ./make-secrets.sh
#   docker compose up -d dc                      (provisions the domain, ~1 min)
#   docker compose run --rm conductor-setup      (prints the first administrator's enrollment link)
#   docker compose up -d
name: ${SC_PROJECT:-samba-conductor}

x-security: &security
  # One SELinux MCS level for the whole stack: containers that share a
  # socket on a volume must share it (two stacks on one host: two levels).
  - no-new-privileges:true
  - label=level:${SC_MCS_LEVEL:-s0:c93,c94}

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-dc-env: &dc-env
  SC_MODE: provision
  SC_REALM: ${SC_DNS_DOMAIN:?set SC_DNS_DOMAIN in .env}
  SC_DOMAIN: ${SC_NETBIOS:?set SC_NETBIOS in .env}
  SC_HOSTNAME: ${SC_HOSTNAME:-dc1}
  SC_HOST_IP: ${SC_HOST_IP:?set SC_HOST_IP in .env}
  SC_NETWORK_MODE: bridge
  SC_DNS_FORWARDERS: ${SC_DNS_FORWARDERS:-}
  SC_TLS: ${SC_TLS:-self-signed}
  # Recovery switches, empty unless needed (see the documentation).
  SC_RETRY_FIRST_BOOT: ${SC_RETRY_FIRST_BOOT:-}
  SC_ALLOW_SAMBA_UPGRADE: ${SC_ALLOW_SAMBA_UPGRADE:-}
  SC_ALLOW_UNSYNCED_CLOCK: ${SC_ALLOW_UNSYNCED_CLOCK:-}

x-setup-env: &setup-env
  SC_REALM: ${SC_DNS_DOMAIN}
  SC_DC_HOST: ${SC_HOSTNAME:-dc1}.${SC_DNS_DOMAIN}
  SC_DC_ADDRESS: ${SC_DC_ADDRESS:-${SC_NET:-172.30.93}.10}
  SC_TLS: ${SC_TLS:-self-signed}

services:
  # Samba AD DC, chronyd (signed time for members) and conductor-helper.
  # Root inside the container with nine capabilities; never privileged.
  dc:
    image: ${SC_IMAGE_PREFIX:-}samba-conductor-dc:${SC_TAG:-0.1.1}
    hostname: ${SC_HOSTNAME:-dc1}
    domainname: ${SC_DNS_DOMAIN}
    environment: *dc-env
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    # File ownership and ACLs of sysvol and the state directories,
    # setuid/setgid for Samba's and chronyd's privilege changes, signals to
    # its own children, low ports. No SYS_ADMIN (NT ACLs in user.NTACL), no
    # SYS_TIME (chronyd -x serves the host's clock).
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, FSETID, KILL, SETUID, SETGID, NET_BIND_SERVICE]
    security_opt: *security
    tmpfs:
      - /run:mode=0755,size=64m
      - /tmp:mode=1777,size=256m
      - /var/cache/samba:mode=0755,size=64m
      - /var/lib/chrony:mode=0755,size=1m
      - /var/log/samba:mode=0755,size=64m
    volumes:
      - dc-data:/var/lib/samba
      - dc-config:/etc/samba
      - dc-public:/var/lib/sc-public
      - dc-issued:/var/lib/sc-issued
      - helper-run:/run/conductor-helper
      # conductor's database, for the backup snapshot (VACUUM INTO).
      - conductor-state:/var/lib/conductor
    secrets: [admin-password]
    # The DC is its own resolver.
    dns: [127.0.0.1]
    dns_search: ["${SC_DNS_DOMAIN}"]
    networks:
      sc:
        ipv4_address: ${SC_NET:-172.30.93}.10
    # Published on the advertised address only (never 0.0.0.0: port 53
    # collides with local resolvers). Samba uses three ports of the RPC range.
    ports:
      - "${SC_HOST_IP}:53:53/tcp"
      - "${SC_HOST_IP}:53:53/udp"
      - "${SC_HOST_IP}:88:88/tcp"
      - "${SC_HOST_IP}:88:88/udp"
      - "${SC_HOST_IP}:123:123/udp"
      - "${SC_HOST_IP}:135:135/tcp"
      - "${SC_HOST_IP}:389:389/tcp"
      - "${SC_HOST_IP}:389:389/udp"
      - "${SC_HOST_IP}:445:445/tcp"
      - "${SC_HOST_IP}:464:464/tcp"
      - "${SC_HOST_IP}:464:464/udp"
      - "${SC_HOST_IP}:636:636/tcp"
      - "${SC_HOST_IP}:3268:3268/tcp"
      - "${SC_HOST_IP}:3269:3269/tcp"
      - "${SC_HOST_IP}:49152-49159:49152-49159/tcp"
    healthcheck:
      test: ["CMD", "/usr/bin/sc-dc-init", "health"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 4
    mem_limit: 2g
    pids_limit: 512
    logging: *logging

  # conductor: unprivileged UID 2093, no capabilities, read-only root.
  conductor:
    image: ${SC_IMAGE_PREFIX:-}samba-conductor:${SC_TAG:-0.1.1}
    user: "2093:2093"
    restart: unless-stopped
    init: true
    depends_on:
      dc:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: *security
    tmpfs:
      # samba-tool's credential cache (GPO create and delete).
      - /tmp:mode=1777,size=16m
    volumes:
      - conductor-etc:/etc/conductor:ro
      - conductor-state:/var/lib/conductor
      - conductor-cred:/run/credentials/conductor:ro
      - helper-run:/run/conductor-helper
      - dc-public:/var/lib/sc-public:ro
    dns: ["${SC_DC_ADDRESS:-${SC_NET:-172.30.93}.10}"]
    dns_search: ["${SC_DNS_DOMAIN}"]
    extra_hosts:
      - "${SC_HOSTNAME:-dc1}.${SC_DNS_DOMAIN}:${SC_DC_ADDRESS:-${SC_NET:-172.30.93}.10}"
    networks: [sc]
    ports:
      - "${SC_HOST_IP}:${SC_CONDUCTOR_PORT:-8443}:8443/tcp"
    mem_limit: 512m
    pids_limit: 256
    logging: *logging

  # One-shot: conductor setup (as root), the TOTP key handed over.
  #   docker compose run --rm conductor-setup
  conductor-setup:
    image: ${SC_IMAGE_PREFIX:-}samba-conductor:${SC_TAG:-0.1.1}
    profiles: [setup]
    user: "0:0"
    entrypoint: ["/usr/bin/sc-setup", "conductor"]
    command: []
    environment:
      <<: *setup-env
      SC_PUBLIC_URL: ${SC_PUBLIC_URL:-https://conductor.${SC_DNS_DOMAIN}:8443}
      SC_FIRST_ADMIN: ${SC_FIRST_ADMIN:-Administrator}
      SC_HELPDESK_GROUP: ${SC_HELPDESK_GROUP:-}
      SC_AUDITOR_GROUP: ${SC_AUDITOR_GROUP:-}
      SC_MFA_POLICY: ${SC_MFA_POLICY:-optional}
    read_only: true
    cap_drop: [ALL]
    # chown to the conductor group; setuid to issue the first enrollment
    # link as the conductor user.
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: *security
    tmpfs:
      - /tmp:mode=1777,size=16m
    volumes:
      - conductor-etc:/etc/conductor
      - conductor-state:/var/lib/conductor
      - conductor-cred:/run/credentials/conductor
      - dc-public:/var/lib/sc-public:ro
      - dc-issued:/var/lib/sc-issued:ro
    secrets: [admin-password]
    dns: ["${SC_DC_ADDRESS:-${SC_NET:-172.30.93}.10}"]
    extra_hosts:
      - "${SC_HOSTNAME:-dc1}.${SC_DNS_DOMAIN}:${SC_DC_ADDRESS:-${SC_NET:-172.30.93}.10}"
    networks: [sc]
    healthcheck:
      disable: true
    logging: *logging

networks:
  sc:
    ipam:
      config:
        - subnet: ${SC_NET:-172.30.93}.0/24
    # No IPv6 in bridge mode: no AAAA record for a container address.
    enable_ipv6: false

volumes:
  dc-data:
  dc-config:
  dc-public:
  dc-issued:
  helper-run:
  conductor-etc:
  conductor-state:
  conductor-cred:

secrets:
  # Remove it from the stack once the domain exists (the DC warns while it
  # is mounted).
  admin-password:
    file: ./secrets/admin-password
