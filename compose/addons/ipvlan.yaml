# Add-on: the stack's network on ipvlan instead of a bridge. Each container
# gets its own address on the LAN behind a host interface (SC_NET_PARENT),
# the DC at SC_DC_ADDRESS and conductor at SC_CONDUCTOR_ADDRESS; nothing is
# published on the host. ipvlan shares the parent's MAC address, so it also
# works on Wi-Fi and on switch ports that allow one MAC address (macvlan.yaml
# gives each container its own MAC address instead).
#   COMPOSE_FILE=compose.yaml:addons/ipvlan.yaml
#   in .env:
#     SC_NET_PARENT=eth0                 the host interface on the LAN
#     SC_NET_MODE=l2                     l2 (default) or l3
#     SC_NET_SUBNET=192.0.2.0/24         the LAN (l2) or a subnet routed to this host (l3)
#     SC_NET_GATEWAY=192.0.2.1           the LAN's router (l2; l3 routes through the parent, any address of the subnet)
#     SC_NET_RANGE=192.0.2.224/28        the addresses Docker hands out (setup one-shots, add-ons)
#     SC_DC_ADDRESS=192.0.2.230          in SC_NET_SUBNET, not in use
#     SC_CONDUCTOR_ADDRESS=192.0.2.231   in SC_NET_SUBNET, not in use
#     SC_HOST_IP=192.0.2.230             the same as SC_DC_ADDRESS (the DC advertises it)
#   docker compose up -d dc
#   docker compose exec dc samba-tool dns add 127.0.0.1 <SC_DNS_DOMAIN> conductor A <SC_CONDUCTOR_ADDRESS> -P
#   docker compose run --rm conductor-setup
#   docker compose up -d
# Caveats:
# - The host cannot reach the containers and they cannot reach the host
#   (a kernel rule of ipvlan and macvlan): open conductor from another
#   machine, and do not use the host itself as SC_DNS_FORWARDERS.
# - Keep SC_NET_RANGE, SC_DC_ADDRESS and SC_CONDUCTOR_ADDRESS out of the
#   LAN's DHCP pool: Docker does not ask the LAN which addresses are free.
# - l3 mode: no ARP and no broadcast; SC_NET_SUBNET must be a subnet of its
#   own, and the LAN's router needs a route to it through this host's
#   address on SC_NET_PARENT.
# - Published ports do not apply on ipvlan: with addons/idp.yaml, give idp
#   a fixed address the same way (ipv4_address in an override file) and
#   register idp.<SC_DNS_DOMAIN> with it instead of "sc-dc-init dns-name".
# - Not with addons/host-network.yaml (the DC is on one network or the other).
services:
  dc:
    environment:
      # The DC owns its address: Samba registers it in DNS as it is.
      SC_NETWORK_MODE: macvlan
      SC_HOST_IP: ${SC_DC_ADDRESS:?set SC_DC_ADDRESS in .env}
    networks:
      sc:
        ipv4_address: ${SC_DC_ADDRESS:?set SC_DC_ADDRESS in .env}
    ports: !reset []

  conductor:
    networks:
      sc:
        ipv4_address: ${SC_CONDUCTOR_ADDRESS:?set SC_CONDUCTOR_ADDRESS in .env}
    ports: !reset []

networks:
  sc:
    driver: ipvlan
    driver_opts:
      parent: ${SC_NET_PARENT:?set SC_NET_PARENT in .env}
      ipvlan_mode: ${SC_NET_MODE:-l2}
    ipam:
      config: !override
        - subnet: ${SC_NET_SUBNET:?set SC_NET_SUBNET in .env}
          gateway: ${SC_NET_GATEWAY:?set SC_NET_GATEWAY in .env}
          ip_range: ${SC_NET_RANGE:?set SC_NET_RANGE in .env}
