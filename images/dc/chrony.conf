# chronyd of the DC container, run with -x: it never adjusts the clock (the
# container shares the host's kernel clock and has no CAP_SYS_TIME). It
# serves the host's time to domain members over NTP (123/udp), signed for
# Windows clients through Samba's ntp_signd socket.
local stratum 10
allow all
ntpsigndsocket /var/lib/samba/ntp_signd
pidfile /run/chrony/chronyd.pid
bindcmdaddress /run/chrony/chronyd.sock
