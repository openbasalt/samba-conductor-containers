# Continuous integration of the container images: the Go gates of
# sc-dc-init and sc-setup, the five images built per architecture on native
# runners from the packages pinned in versions.env (verified against the
# OpenBasalt release key), and a smoke test of the single-DC stack: a fresh
# provision, the healthchecks, idempotency on recreate and the security
# assertions (no privileged mode, exact capabilities, read-only roots).
# Nothing is pushed; no secret is used. Actions are pinned by commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gofmt, vet, staticcheck, govulncheck, go test -race
        run: make check

  images:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the five images (packages from the APT repository, verified)
        run: ./build-local.sh --tag ci
      - name: smoke test (single DC, bridge networking, security assertions)
        run: scripts/ci-smoke.sh ci
